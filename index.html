main{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 120px) 34px calc(env(safe-area-inset-bottom,0px) + 70px)}
.card{position:relative;width:min(100%,400px);background:#fffdfd;border:4px solid var(--brown);
 box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink2),10px 10px 0 7px var(--pink2);
 padding:56px 18px 34px;text-align:center}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;background:var(--bg)}
.card::before{left:-4px;top:-4px;border-right:4px solid var(--brown);border-bottom:4px solid var(--brown)}
.card::after{right:-4px;bottom:-4px;border-left:4px solid var(--brown);border-top:4px solid var(--brown)}
.cat{position:absolute;width:62%;left:-9%;bottom:calc(100% - 24px);mix-blend-mode:multiply;image-rendering:pixelated}
h1{font-family:'Aref Ruqaa','Amiri',serif;font-weight:700;font-size:clamp(120px,36vw,190px);line-height:1.15;color:var(--ink);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--pink2)}
.num{display:flex;align-items:center;gap:14px;margin:4px 6px 20px;direction:ltr}
.num::before,.num::after{content:"";flex:1;height:3px;background:var(--brown)}
.num span{font-family:Silkscreen,'Courier New',monospace;font-weight:700;font-size:clamp(40px,13vw,60px);line-height:1;letter-spacing:.08em;color:var(--ink)}
.pill{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;margin:0 auto;width:min(100%,300px);padding:14px 10px;background:#fffafa;
 border:4px solid var(--brown);box-shadow:inset 0 0 0 4px var(--pink2),inset 0 0 0 7px #fff;border-radius:10px}
.pill b{font-family:Silkscreen,'Courier New',monospace;font-weight:700;font-size:clamp(30px,9.5vw,44px);line-height:1;letter-spacing:.1em;color:var(--ink);display:inline-block;animation:hop 1.8s ease-in-out infinite}
.pill b:nth-of-type(2){animation-delay:.18s}.pill b:nth-of-type(3){animation-delay:.36s}
.pill .h{width:14px;animation:beat 1.2s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}40%{transform:translateY(-2px)}}
@keyframes beat{50%{transform:scale(1.3)}}
.s,.h{display:block}
.s{position:absolute;animation:tw 2.8s ease-in-out infinite}
.s svg,.h svg{width:100%;display:block}
.hh{position:absolute;width:30px;animation:beat 2.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.7);opacity:.65}}
.fl{position:absolute;width:12px;opacity:0;animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@media (min-width:900px){
